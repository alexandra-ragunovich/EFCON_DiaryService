syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.travel.grpc";

service DiaryGrpcService {
  rpc CreateDiaryPost (GrpcDiaryPostRequest) returns (GrpcDiaryPostResponse);
}

message GrpcDiaryPostRequest {
  int64 userId = 1;
  string title = 2;
  string content = 3;
  string location = 4;
  bool isPublic = 5;
  string transportInfo = 6;
  string duration = 7;
}

message GrpcDiaryPostResponse {
  int64 postId = 1;
  string status = 2;
}